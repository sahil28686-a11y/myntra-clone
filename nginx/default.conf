# =============================================================================
# Myntra Clone — Nginx Reverse Proxy (Medusa v2)
# =============================================================================
# Domain is deferred (§6.6). Placeholder: myntra-clone.local
# Replace ALL occurrences of myntra-clone.local with your real domain at
# deploy time, and update the SSL certificate paths accordingly.
#
# v2 routing notes:
#   - Medusa v2 serves its native admin app at the /app path
#     (evidence: @medusajs/framework/dist/config/config.js → admin.path="/app")
#   - The admin SPA + its assets live under /app; the admin REST API lives
#     under /admin; auth endpoints under /auth. All are served from port 9000.
#   - We proxy admin.* → medusa:9000 PRESERVING the path (NOT stripping /app),
#     and redirect the bare subdomain root → /app so users land on the admin UI.
#   - Health endpoint: GET /health → 200 "OK" (evidence: start.js app.get("/health"))
# =============================================================================

upstream medusa_backend {
    server medusa:9000;
    keepalive 64;
}

upstream storefront_frontend {
    server storefront:3000;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# SSL session cache
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Main storefront — HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name myntra-clone.local www.myntra-clone.local;
    return 301 https://$server_name$request_uri;
}

# Main storefront — HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myntra-clone.local www.myntra-clone.local;

    # SSL certificates (managed by certbot — replace paths with real domain)
    ssl_certificate /etc/letsencrypt/live/myntra-clone.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myntra-clone.local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2
        image/webp;

    # Rate limiting
    limit_req zone=api_limit burst=50 nodelay;
    limit_conn conn_limit 10;

    # Root for favicon and static
    root /var/www/html;
    index index.html;

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot|css|js)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # Storefront proxy
    location / {
        proxy_pass http://storefront_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Don't rate limit static assets
        limit_req off;
    }

    # Next.js static chunks - aggressive caching
    location /_next/static {
        proxy_pass http://storefront_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
        limit_req off;
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://storefront_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (no rate limit) — proxied to storefront
    location /health {
        proxy_pass http://storefront_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
        limit_req off;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Large client body for uploads
    client_max_body_size 50M;
}

# Admin subdomain — serves Medusa v2 native admin app (served at /app on port 9000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.myntra-clone.local;

    ssl_certificate /etc/letsencrypt/live/admin.myntra-clone.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.myntra-clone.local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting (stricter for admin)
    limit_req zone=admin_limit burst=20 nodelay;
    limit_conn conn_limit 5;

    # Redirect bare admin root → /app (the v2 admin app path).
    # The admin SPA and its assets are served at /app by the backend; we must
    # preserve this prefix (NOT strip it) when proxying to medusa:9000.
    location = / {
        return 301 /app;
    }

    # Proxy everything else to the backend, preserving the path.
    # This correctly routes:
    #   /app, /app/*      → medusa:9000/app, /app/*   (admin SPA + assets)
    #   /admin, /admin/*  → medusa:9000/admin, /admin/* (admin REST API)
    #   /auth, /auth/*    → medusa:9000/auth, /auth/*   (auth endpoints)
    location / {
        proxy_pass http://medusa_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Admin uploads (larger body)
    location /admin/uploads {
        client_max_body_size 100M;
        proxy_pass http://medusa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    client_max_body_size 100M;
}

# API subdomain — Medusa v2 store + admin REST API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.myntra-clone.local;

    ssl_certificate /etc/letsencrypt/live/api.myntra-clone.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.myntra-clone.local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Rate limiting for API
    limit_req zone=api_limit burst=100 nodelay;
    limit_conn conn_limit 20;

    # CORS headers — storefront origin
    add_header Access-Control-Allow-Origin "https://myntra-clone.local" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-publishable-api-key" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://myntra-clone.local";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-publishable-api-key";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Proxy to Medusa v2 backend — /store/*, /admin/*, /auth/* all served on :9000
    location / {
        proxy_pass http://medusa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Upload endpoint (larger body)
    location /admin/uploads {
        client_max_body_size 100M;
        proxy_pass http://medusa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Store uploads (served as static files)
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    client_max_body_size 100M;
}

# Uploads server for direct file serving
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uploads.myntra-clone.local;

    ssl_certificate /etc/letsencrypt/live/uploads.myntra-clone.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uploads.myntra-clone.local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}