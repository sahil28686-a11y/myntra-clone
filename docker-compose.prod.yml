# =============================================================================
# Myntra Clone — Production Compose (Medusa v2)
# =============================================================================
# Usage: see docs/deployment-guide.md
# Migrations run via deploy.sh (medusa db:migrate), NOT in the Dockerfile.
# Payments are COD-only for this pass (per §6.1) — no Razorpay keys.
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: myntra-postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myntra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myntra_pass}
      POSTGRES_DB: ${POSTGRES_DB:-myntra_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myntra} -d ${POSTGRES_DB:-myntra_store}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    networks:
      - myntra_network

  redis:
    image: redis:7-alpine
    container_name: myntra-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - myntra_network

  medusa:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: myntra/medusa:latest
    container_name: myntra-medusa
    restart: always
    expose:
      - "9000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-myntra}:${POSTGRES_PASSWORD:-myntra_pass}@postgres:5432/${POSTGRES_DB:-myntra_store}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # v2 CORS — AUTH_CORS is required by the v2 framework (medusa-config.ts)
      STORE_CORS: ${STORE_CORS:-https://myntra-clone.local}
      ADMIN_CORS: ${ADMIN_CORS:-https://admin.myntra-clone.local}
      AUTH_CORS: ${AUTH_CORS:-https://admin.myntra-clone.local}
      # Payments: COD-only for this pass (§6.1). Razorpay keys are NOT set.
      PORT: "9000"
    volumes:
      - medusa_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # v2 health endpoint: GET /health → 200 "OK"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - myntra_network

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: myntra/storefront:latest
    container_name: myntra-storefront
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_URL: ${NEXT_PUBLIC_MEDUSA_URL:-https://api.myntra-clone.local}
      MEDUSA_URL: http://medusa:9000
      PORT: "3000"
    depends_on:
      medusa:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    networks:
      - myntra_network

volumes:
  postgres_data:
    name: myntra_postgres_data
  redis_data:
    name: myntra_redis_data
  medusa_uploads:
    name: myntra_medusa_uploads

networks:
  myntra_network:
    name: myntra_network
    driver: bridge